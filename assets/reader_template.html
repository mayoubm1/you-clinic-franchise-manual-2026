<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOU WELLNESS CLINIC — Global Standard Franchise Manual · Interactive Portal</title>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<style>
  :root {
    --bg:#080b13; --panel:rgba(15,22,38,.88); --cyan:#00f2fe; --blue:#4facfe;
    --txt:#e6eef7; --mut:#8fa3bd; --line:rgba(0,242,254,.22); --hl:rgba(0,242,254,.15);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(0,242,254,.10), transparent 60%),
      linear-gradient(180deg,#05070d 0%, var(--bg) 42%);
    color:var(--txt); display:flex; height:100vh; overflow:hidden;
  }
  /* ================= sidebar ================= */
  #sidebar { width:330px; min-width:330px; background:var(--panel); backdrop-filter:blur(14px);
    border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:10; }
  .brand { padding:18px 20px 12px; border-bottom:1px solid var(--line); letter-spacing:.5px; }
  .brand .logo small { display:block; color:var(--cyan); font-weight:700; letter-spacing:3px; font-size:13px; }
  .brand .logo strong { display:block; color:#fff; font-size:15px; margin-top:3px; }
  .brand .meta { color:var(--mut); font-size:11px; margin-top:6px; }
  #search { margin:12px 16px; display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,.45); border:1px solid var(--line); border-radius:6px; padding:0 10px; }
  #search kbd { color:var(--cyan); font-size:10px; opacity:.7; }
  #search input { flex:1; background:transparent; border:0; outline:0; color:#fff; padding:9px 2px; font-size:13px; }
  #search input::placeholder { color:var(--mut); }
  #chapter-list { flex:1; overflow-y:auto; padding:4px 10px 14px; }
  #chapter-list .ch { display:flex; align-items:center; gap:10px; color:var(--mut); cursor:pointer;
    padding:10px 10px; border-radius:6px; font-size:13px; border-left:2px solid transparent; }
  #chapter-list .ch:hover { background:rgba(255,255,255,.05); color:#fff; }
  #chapter-list .ch.active { background:var(--hl); color:var(--cyan); border-left-color:var(--cyan); }
  #chapter-list .ch .num { font-family:Consolas,monospace; font-size:11px; opacity:.8; min-width:22px; }
  #summary-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 16px; border-top:1px solid var(--line); font-size:11px; color:var(--mut); }
  #summary-cards b { display:block; color:var(--cyan); font-size:16px; font-family:Consolas,monospace; }
  /* ================= viewport ================= */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #hudbar { height:56px; background:var(--panel); border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between; padding:0 16px; gap:12px; }
  #hudbar .title { font-size:13px; letter-spacing:1px; color:var(--mut); }
  #hudbar .title b { color:#fff; }
  .btn { background:rgba(0,242,254,.10); border:1px solid var(--line); color:var(--cyan); padding:7px 12px;
    border-radius:6px; cursor:pointer; font-size:12px; letter-spacing:.5px; }
  .btn:hover { background:var(--cyan); color:#000; }
  .btn.active { background:var(--cyan); color:#000; }
  .btn.ghost { background:transparent; color:var(--mut); }
  .btn:disabled { opacity:.35; cursor:default; }
  .audio-group { display:flex; align-items:center; gap:8px; }
  select.voice, .rate { background:#000; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:5px 6px; font-size:12px; max-width:190px; }
  #content { flex:1; overflow-y:auto; padding:34px 44px 90px; scroll-behavior:smooth; }
  #content::before { content:''; display:block; height:2px; width:110px; background:linear-gradient(90deg,var(--cyan),transparent); margin-bottom:26px; opacity:.7; }
  .chapter-card { max-width:980px; margin:0 auto; position:relative; }
  /* paper-like chapter body: the chapter's own (scoped) light styles apply inside #chN */
  .chapter-frame { background:#FBFAF7; color:#17181a; border:1px solid rgba(0,242,254,.12); border-radius:14px;
    padding:38px 46px; box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .chapter-frame #ch1, .chapter-frame #ch2, .chapter-frame #ch3, .chapter-frame #ch4, .chapter-frame #ch5,
  .chapter-frame #ch6, .chapter-frame #ch7, .chapter-frame #ch8, .chapter-frame #ch9, .chapter-frame #ch10 { background:transparent; }
  .ch-tag { display:inline-flex; align-items:center; gap:8px; font-family:Consolas,monospace; font-size:12px;
    color:var(--cyan); letter-spacing:2px; margin-bottom:10px; text-transform:uppercase; }
  .ch-tag .line { width:34px; height:1px; background:var(--line); }
  /* speech highlight for the current reading block */
  .speech-highlight { background:var(--hl) !important; box-shadow:0 0 0 3px rgba(0,242,254,.18); border-radius:4px; }
  .reading-now { outline:2px solid var(--cyan); outline-offset:3px; }
  /* ================= bottom progress bar ================= */
  #progressbar { position:fixed; left:330px; right:0; bottom:0; height:52px; background:var(--panel);
    border-top:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 18px; z-index:20; }
  #progressbar .pct { font-family:Consolas,monospace; color:var(--cyan); font-size:13px; width:52px; }
  #track { flex:1; height:6px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
  #fill { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--blue)); transition:width .25s; }
  #progressbar .chips { display:flex; gap:6px; overflow-x:auto; max-width:46%; }
  #progressbar .chips .chip { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--mut);
    font-size:11px; padding:4px 8px; border-radius:12px; cursor:pointer; white-space:nowrap; }
  #progressbar .chips .chip.on { color:var(--cyan); border-color:var(--cyan); }
  /* ================= command palette ================= */
  #palette { position:fixed; inset:0; background:rgba(3,6,12,.72); backdrop-filter:blur(6px); display:none;
    align-items:flex-start; justify-content:center; padding-top:14vh; z-index:40; }
  #palette.open { display:flex; }
  #p-box { width:640px; max-width:92vw; background:#0c1424; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 40px 120px rgba(0,0,0,.7); overflow:hidden; }
  #p-box .phead { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  #p-box input { flex:1; background:transparent; border:0; outline:0; color:#fff; font-size:15px; }
  #p-results { max-height:44vh; overflow-y:auto; padding:8px; }
  #p-results .pr { padding:10px 12px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--mut); }
  #p-results .pr:hover, #p-results .pr.sel { background:var(--hl); color:var(--cyan); }
  #p-results .pr small { color:var(--mut); opacity:.7; }
  /* ================= 3D as-built widget ================= */
  .asbuilt-3d-widget { position:relative; width:100%; height:400px; margin:1.6rem 0;
    background:radial-gradient(circle at center,#0f172a 0%,#050811 100%);
    border:1px solid rgba(0,242,254,.3); border-radius:10px; overflow:hidden;
    box-shadow:0 0 24px rgba(0,242,254,.08); }
  .asbuilt-3d-widget canvas { width:100% !important; height:100% !important; display:block; }
  .hud-3d-overlay { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:6px;
    z-index:5; background:rgba(9,13,22,.78); backdrop-filter:blur(8px); padding:8px;
    border:1px solid rgba(0,242,254,.22); border-radius:7px; }
  .hud-3d-btn { background:rgba(0,242,254,.1); border:1px solid rgba(0,242,254,.3); color:#00f2fe;
    font-size:.72rem; padding:4px 10px; border-radius:4px; cursor:pointer; font-family:Consolas,monospace;
    text-transform:uppercase; transition:all .2s; }
  .hud-3d-btn:hover, .hud-3d-btn.active { background:#00f2fe; color:#000; }
  .hud-3d-status { position:absolute; bottom:12px; left:12px; font-family:Consolas,monospace; font-size:.72rem;
    color:#94a3b8; pointer-events:none; background:rgba(0,0,0,.62); padding:4px 9px; border-radius:5px;
    border-left:2px solid #00f2fe; }
  /* ================= status beacon ================= */
  .beacon { width:8px; height:8px; border-radius:50%; background:var(--cyan); display:inline-block;
    box-shadow:0 0 10px var(--cyan); animation:pulse 1.6s infinite; margin-right:6px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(0,242,254,.25); border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
  @media print { body{display:none} }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="logo">
      <small>YOU WELLNESS CLINIC</small>
      <strong>Global Standard Franchise Manual</strong>
    </div>
    <div class="meta">V2.1.4 ELITE · Interactive Portal · 10 Chapters</div>
  </div>
  <div id="search">
    <input type="text" id="search-input" placeholder="Search all chapters & sections…" autocomplete="off">
    <kbd>Ctrl&nbsp;K</kbd>
  </div>
  <div id="chapter-list"></div>
  <div id="summary-cards">
    <div><b id="s-ch">0</b>Chapters</div>
    <div><b id="s-sec">0</b>Sections</div>
    <div><b id="s-w">0</b>Words</div>
  </div>
</aside>

<main id="main">
  <header id="hudbar">
    <div class="title"><span class="beacon"></span><b id="hud-ch">—</b>&nbsp;<span id="hud-sec" style="color:var(--mut)"></span></div>
    <div class="audio-group">
      <button class="btn" id="btn-speak" onclick="voice.toggle()">▶ Intercom</button>
      <button class="btn ghost" onclick="voice.stop()">■ Stop</button>
      <select class="voice" id="voice-select" onchange="voice.setVoice(this.value)"><option value="">Voice…</option></select>
      <label style="color:var(--mut);font-size:11px">Speed <input class="rate" type="range" min="0.7" max="1.4" step="0.1" value="1" onchange="voice.rate=+this.value" style="vertical-align:middle;width:70px"></label>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="openPalette()">🔎 Ctrl K</button>
      <button class="btn" onclick="window.open('master.html','_blank')">🖨 Print / PDF</button>
    </div>
  </header>

  <section id="content">
    <div id="reader-root"></div>
  </section>
</main>

<div id="progressbar">
  <span class="pct" id="pct">0%</span>
  <div id="track"><div id="fill"></div></div>
  <div class="chips" id="chips"></div>
</div>

<div id="palette" onclick="if(event.target===this)closePalette()">
  <div id="p-box">
    <div class="phead">
      <span style="color:var(--cyan)">⌕</span>
      <input id="p-input" placeholder="Jump to chapter or section…" autocomplete="off">
      <kbd style="color:var(--mut);font-size:11px">Esc</kbd>
    </div>
    <div id="p-results"></div>
  </div>
</div>

<script>
/*__CHAPTERS__*/
const CHAPTERS = /*__CHAPTERS__*/;

/* ---------- speech engine ---------- */
const voice = {
  synth: window.speechSynthesis, voices: [], out: null, rate: 1, on: false,
  queue: [], idx: -1,
  loadVoices() {
    this.voices = this.synth.getVoices();
    const sel = document.getElementById('voice-select');
    sel.innerHTML = '<option value="">Voice…</option>';
    this.voices.forEach((v, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = v.name + ' (' + v.lang + ')';
      if (v.default || /^en/i.test(v.lang)) o.dataset.en = 1;
      sel.appendChild(o);
    });
    const en = [...sel.options].find(o => o.dataset.en);
    if (en) sel.value = en.value;
  },
  setVoice(i) { this.vi = isNaN(+i) ? null : +i; },
  toggle() {
    if (this.synth.speaking && this.synth.paused) { this.synth.resume(); this.on = true; return; }
    this.stop();
    const root = document.getElementById('ch' + state.ch);
    if (!root) return;
    this.queue = [];
    const walk = (el, depth) => { for (const c of el.children) {
      if (/^(H1|H2|H3|H4|P|LI|TD|TH)$/.test(c.tagName) && c.innerText.trim()) this.queue.push(c);
      else walk(c, depth + 1);
    } };
    walk(root, 0); this.idx = 0; this.on = true; this.playNext();
  },
  playNext() {
    if (!this.on || this.idx >= this.queue.length) { this.finish(); return; }
    if (this.idx > 0) this.queue[this.idx - 1].classList.remove('speech-highlight');
    const el = this.queue[this.idx];
    el.classList.add('speech-highlight');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    this.out = new SpeechSynthesisUtterance(el.innerText);
    if (this.vi != null) this.out.voice = this.voices[this.vi];
    this.out.rate = this.rate; this.out.pitch = .95;
    this.out.onend = () => { this.idx++; this.playNext(); };
    this.out.onerror = () => this.finish();
    this.synth.speak(this.out);
  },
  stop() {
    this.on = false; if (this.synth) this.synth.cancel();
    if (this.queue[this.idx]) this.queue[this.idx].classList.remove('speech-highlight');
    this.idx = -1; this.queue = [];
  },
  finish() { this.on = false; this.queue.forEach(el => el.classList.remove('speech-highlight')); }
};
if ('speechSynthesis' in window) {
  voice.synth.onvoiceschanged = () => voice.loadVoices();
}

/* ---------- reader state ---------- */
const state = { ch: 1 };
let allSections = [];
const root = document.getElementById('reader-root');

function esc(s){ return s.replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function buildChapter(c) {
  return '<nav class="chapter-card">' +
    '<div class="ch-tag"><span class="line"></span>CHAPTER ' + String(c.n).padStart(2,'0') + '</div>' +
    '<div class="chapter-frame"><div id="ch' + c.n + '">' + c.html + '</div></div>' +
    '<style>' + c.css + '</style>' +
    '</nav>';
}

function loadChapter(n, jumpTop) {
  voice.stop();
  state.ch = n;
  const c = CHAPTERS.find(x => x.n === n);
  root.innerHTML = buildChapter(c);
  document.querySelectorAll('#chapter-list .ch').forEach(li => li.classList.toggle('active', +li.dataset.n === n));
  document.querySelectorAll('#chips .chip').forEach(li => li.classList.toggle('on', +li.dataset.n === n));
  document.getElementById('hud-ch').textContent = 'CHAPTER ' + String(n).padStart(2, '0');
  const h1 = root.querySelector('#ch' + n + ' h1');
  document.getElementById('hud-sec').textContent = h1 ? h1.innerText : '';
  document.getElementById('chips').scrollTo({ left: 0 });
  document.getElementById('content').scrollTop = 0;
  computeSections();
  updateProgress();
  if (window.asBuiltManager) {
    try { window.asBuiltManager.initViewers(root.querySelector('#ch' + n)); } catch (e) { console.warn('3d init', e); }
  }
}

function computeSections() {
  const host = document.getElementById('ch' + state.ch);
  allSections = host ? [...host.querySelectorAll('h2')].map(h => ({ t: h.innerText, el: h })) : [];
  document.getElementById('hud-sec').textContent = allSections[0] ? allSections[0].t : '';
}

/* ---------- sidebar ---------- */
function renderSidebar(chapters) {
  const list = document.getElementById('chapter-list');
  list.innerHTML = chapters.map(c =>
    '<div class="ch" data-n="' + c.n + '" onclick="loadChapter(' + c.n + ')">' +
    '<span class="num">' + String(c.n).padStart(2,'0') + '</span><span>' + esc(c.title) + '</span></div>'
  ).join('');
  const ch = document.getElementById('summary-cards');
  ch.querySelector('#s-ch').textContent = CHAPTERS.length;
  ch.querySelector('#s-sec').textContent = CHAPTERS.reduce((a, c) =>
    a + (c.html.match(/<h2[ >]/gi) || []).length, 0);
  ch.querySelector('#s-w').textContent = CHAPTERS.reduce((a, c) =>
    a + c.html.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length, 0).toLocaleString();
}
renderSidebar(CHAPTERS);

/* ---------- search (live filter + match jump) ---------- */
document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  const list = document.getElementById('chapter-list');
  if (!q) { renderSidebar(CHAPTERS); return; }
  const glob = CHAPTERS.map(c => c).filter(c => c.title.toLowerCase().includes(q) ||
    strip(c.html).toLowerCase().includes(q));
  list.innerHTML = glob.map(c =>
    '<div class="ch" data-n="' + c.n + '" onclick="loadChapter(' + c.n + ')">' +
    '<span class="num">' + String(c.n).padStart(2,'0') + '</span><span>' + esc(c.title) + '</span></div>'
  ).join('');
});
function strip(h){ return h.replace(/<[^>]+>/g, ' '); }

/* ---------- progress ---------- */
function onScroll() {
  const el = document.getElementById('content');
  const ratio = el.scrollTop / (el.scrollHeight - el.clientHeight || 1);
  document.getElementById('fill').style.width = (ratio * 100).toFixed(1) + '%';
  document.getElementById('pct').textContent = Math.round(ratio * 100) + '%';
}
document.getElementById('content').addEventListener('scroll', onScroll);

/* ---------- chapter chips ---------- */
(function () {
  const box = document.getElementById('chips');
  box.innerHTML = CHAPTERS.map(c => '<span class="chip" data-n="' + c.n + '" onclick="loadChapter(' + c.n + ')">' +
    String(c.n).padStart(2, '0') + '</span>').join('');
})();

/* ---------- command palette ---------- */
function openPalette() {
  document.getElementById('palette').classList.add('open');
  document.getElementById('p-input').value = '';
  renderPalette('');
  document.getElementById('p-input').focus();
}
function closePalette() { document.getElementById('palette').classList.remove('open'); }
function renderPalette(q) {
  const res = document.getElementById('p-results');
  q = q.toLowerCase();
  const rows = [];
  CHAPTERS.forEach(c => {
    rows.push({ ch: c.n, t: c.title, w: 'n' });
    if (!q || c.title.toLowerCase().includes(q)) return;
    const secs = c.html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/gi) || [];
    secs.forEach(s => {
      const t = strip(s).trim();
      if (t && (!q || t.toLowerCase().includes(q))) rows.push({ ch: c.n, t, w: 'h' });
    });
  });
  res.innerHTML = rows.slice(0, 60).map(r =>
    '<div class="pr" onclick="goto(' + r.ch + ')"><small>' + String(r.ch).padStart(2,'0') + '</small> &nbsp; ' + esc(r.t) + '</div>'
  ).join('') || '<div class="pr" style="color:var(--mut)">No matches…</div>';
}
document.getElementById('p-input').addEventListener('input', e => renderPalette(e.target.value));
function goto(n) { closePalette(); loadChapter(n); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closePalette();
  if (e.key === 'ArrowRight' && state.ch < CHAPTERS.length) loadChapter(state.ch + 1);
  if (e.key === 'ArrowLeft' && state.ch > 1) loadChapter(state.ch - 1);
});

/* ---------- init ---------- */
loadChapter(1);
</script>
<script type="module" src="assets/js/viewer3d.js"></script>
</body>
</html>
