name: Build and Deploy Manual Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (for build.js shim)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build.js shells out to build_portal.py (single source of truth for the build).
      # It regenerates chapters/, chapters.json, index.html and master.html.
      - name: Compile manual (build.js -> build_portal.py)
        run: node build.js

      # --- Quality gates (before anything reaches production) ---
      # Lint all generated HTML. Config lives in .htmlhintrc (ASCII diagram
      # arrows `-->` / `<====>` are deliberately allowed via spec-char-escape:false).
      - name: Lint generated HTML
        run: npx --yes htmlhint "**/*.html"

      # Deterministic internal link check: fails on any missing local asset.
      # The optional as-built .gltf model is reported as informational (procedural
      # fallback is shown until a real model is added).
      - name: Check internal links
        run: python tools/check_links.py

      # External link check (the only external reference is the brand site).
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude facility-as-built\.gltf '**/*.html'
          fail: true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4